<svg width="96" height="96" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verrou">
  <title>Verrou — draft mark concept ("The Bolt": angular padlock, V for Verrou)</title>
  <!-- Angular shackle — the "thrown bolt", pointed apex reads as a sharp V -->
  <path d="M16 24 V19 L24 12.5 L32 19 V24" stroke="#7E84E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock body -->
  <rect x="10" y="23" width="28" height="17" rx="5.5" stroke="#7E84E8" stroke-width="4"/>
  <!-- Keyhole -->
  <circle cx="24" cy="30.5" r="2.3" fill="#7E84E8"/>
  <path d="M24 32.5 V35.5" stroke="#7E84E8" stroke-width="3" stroke-linecap="round"/>
</svg>
